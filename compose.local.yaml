name: ${DYLAN_PROJECT:-dylans-lawn-demo}
services:
  web:
    build:
      context: .
      args:
        REVISION: ${DYLAN_REVISION:-local}
    image: ${DYLAN_WEB_IMAGE:-dylans-lawn-demo:local}
    ports:
      - "127.0.0.1:${DYLAN_PORT:-4177}:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      booking:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /data, /config]
    logging:
      options:
        max-size: "5m"
        max-file: "2"
  booking:
    build:
      context: ./booking
    image: ${DYLAN_BOOKING_IMAGE:-dylans-lawn-demo-booking:local}
    ports:
      - "127.0.0.1:${DYLAN_ADMIN_PORT:-4178}:8082"
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:4177}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:4178}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Use the website launcher to create private local settings}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_OAUTH_MODE: ${GOOGLE_OAUTH_MODE:-desktop}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - booking-data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8081/healthz && wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 25
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    logging:
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  booking-data:
    name: ${DYLAN_PROJECT:-dylans-lawn-demo}_booking-data
